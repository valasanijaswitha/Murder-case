<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" role="img" aria-labelledby="title desc">
  <title id="title">A faint apparition of Dr. Vikram Sen</title>
  <desc id="desc">A translucent, grey-blue human apparition surrounded by soft mist.</desc>
  <defs>
    <linearGradient id="apparition" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5e0e1" stop-opacity=".58"/>
      <stop offset=".42" stop-color="#9eafb2" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6d858a" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="face" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#e3ebea" stop-opacity=".55"/>
      <stop offset="1" stop-color="#91a5a8" stop-opacity=".12"/>
    </radialGradient>
    <filter id="soften" x="-35%" y="-15%" width="170%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="mist" x="-60%" y="-80%" width="220%" height="260%">
