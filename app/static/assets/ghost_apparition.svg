    <path d="M119 120 C105 137 101 160 108 183 L83 238 C74 261 76 294 86 327 L101 378 C107 401 111 430 108 464 C125 478 171 481 196 462 C191 426 197 397 208 370 L225 327 C234 296 235 264 222 237 L195 183 C202 156 195 135 183 120 C165 132 137 132 119 120Z" fill="url(#apparition)"/>
    <path d="M109 174 C83 188 64 217 50 251 L59 260 C82 241 103 220 121 199Z" fill="url(#apparition)" opacity=".72"/>
    <path d="M197 174 C224 188 244 217 258 251 L249 260 C226 241 205 220 185 199Z" fill="url(#apparition)" opacity=".72"/>
    <path d="M111 326 C91 362 77 407 69 463 L94 470 C112 431 126 394 138 350Z" fill="url(#apparition)" opacity=".72"/>
    <path d="M190 326 C209 362 224 407 232 463 L207 470 C189 431 175 394 163 350Z" fill="url(#apparition)" opacity=".72"/>
