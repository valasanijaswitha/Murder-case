{% extends "base.html" %}
{% block head %}
<style>
.notes-wrap {
  min-height: 100vh; display: flex; flex-direction: column;
  background: var(--bg); padding: 20px 24px;
}
.header-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
}
.notes-container {
  flex-grow: 1; display: flex; flex-direction: column;
  max-width: 800px; margin: 0 auto; width: 100%;
}
.notes-area {
  flex-grow: 1; width: 100%; resize: none; padding: 20px;
  background: rgba(11,16,28,0.8) !important;
  border: 1px solid var(--border) !important;
  color: var(--text-bright) !important;
  font-family: var(--fb) !important;
  font-size: 14px; line-height: 1.6;
  margin-bottom: 16px; transition: border-color 0.2s;
}
.notes-area:focus {
  border-color: var(--border-ac) !important; outline: none;
}
.action-bar {
  display: flex; justify-content: space-between; align-items: center;
}
.status-msg {
  font-family: var(--fm); font-size: 14px; letter-spacing: 0.1em;
  color: var(--success); opacity: 0; transition: opacity 0.3s;
}
.status-msg.show { opacity: 1; }
</style>
{% endblock %}

{% block content %}
<div class="notes-wrap">
  <header class="header-bar">
    <div>
      <div style="font-family:var(--fm); font-size: 16px; letter-spacing:0.28em; color:var(--text-dim); margin-bottom:4px;">
        CASE 09 // PRIVATE DOSSIER
      </div>
      <div style="font-family:var(--fd); font-size: 26px; font-weight:700; letter-spacing:0.16em; color:var(--text-bright);">
        THEORY NOTES
      </div>
    </div>
    <div style="display:flex; gap:12px; align-items:center;">
      <a href="{{ url_for('team.dashboard') }}" class="btn btn-ghost" style="font-size: 14px;">← HQ DASHBOARD</a>
    </div>
  </header>

  <div class="notes-container">
    <textarea id="notes-input" class="notes-area" placeholder="Compile your findings, contradictions, and theories here. These notes are secure and private to your team.">{{ team.theory_notes }}</textarea>
    
    <div class="action-bar">
      <div id="save-status" class="status-msg">NOTES SECURED</div>
      <button class="btn btn-primary" id="save-btn" onclick="saveNotes()">SAVE DOSSIER</button>
    </div>
  </div>
</div>

<script>
async function saveNotes() {
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('save-status');
  const text = document.getElementById('notes-input').value;
  
  btn.textContent = 'SAVING...';
  btn.disabled = true;
  
  try {
    const res = await fetch('{{ url_for("team.notes") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes: text })
    });
    const data = await res.json();
    
    if (data.status === 'ok') {
      status.textContent = 'NOTES SECURED';
      status.style.color = 'var(--success)';
      status.classList.add('show');
      setTimeout(() => status.classList.remove('show'), 3000);
    } else {
      throw new Error();
    }
  } catch (err) {
    status.textContent = 'SAVE FAILED - RETRY';
    status.style.color = 'var(--danger)';
    status.classList.add('show');
  } finally {
    btn.textContent = 'SAVE DOSSIER';
    btn.disabled = false;
  }
}
</script>
{% endblock %}
